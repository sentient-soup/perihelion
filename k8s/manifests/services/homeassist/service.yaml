apiVersion: v1
kind: Service
metadata:
  name: homeassist
  namespace: apps
  labels:
    app.kubernetes.io/name: homeassist
  annotations:
    # Pinned so a fresh cluster can't hand this Service .220 before Pihole
    # (same sync wave) claims it.
    metallb.io/loadBalancerIPs: 192.168.1.222
spec:
  type: LoadBalancer
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8123
  selector:
    app.kubernetes.io/name: homeassist
