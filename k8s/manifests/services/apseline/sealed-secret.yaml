# Generate this file with kubeseal. Do not commit plain secrets.
#
# 1. Create the plain secret (do NOT commit this file). Only the keys the app
#    actually consumes as secrets; everything else lives in the ConfigMap.
#    Leave OAUTH_CLIENT_SECRET empty if OAUTH_ENABLED=false.
#    kubectl create secret generic apseline-secrets \
#      --namespace apps \
#      --from-literal=SESSION_SECRET=<random-string> \
#      --from-literal=CLOUDFLARE_API_TOKEN=<cf-token> \
#      --from-literal=OAUTH_CLIENT_SECRET=<oauth-secret-or-empty> \
#      --dry-run=client -o yaml > /tmp/apseline-secrets.yaml
#
# 2. Seal it offline against the committed cert:
#    kubeseal --cert k8s/pub-cert.pem \
#      --namespace apps \
#      < /tmp/apseline-secrets.yaml > k8s/manifests/services/apseline/sealed-secret.yaml
#
# Replace the contents below with the output of kubeseal:
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: apseline-secrets
  namespace: apps
spec:
  encryptedData:
    SESSION_SECRET: REPLACE_WITH_KUBESEAL_OUTPUT
    CLOUDFLARE_API_TOKEN: REPLACE_WITH_KUBESEAL_OUTPUT
    OAUTH_CLIENT_SECRET: REPLACE_WITH_KUBESEAL_OUTPUT
  template:
    metadata:
      name: apseline-secrets
      namespace: apps
