# media.perihelion.live -> jellyfin on phis4:8096
# The nginx config had a separate /socket location for websockets; Traefik
# upgrades websockets on the same route automatically, so one route covers both.
---
apiVersion: v1
kind: Service
metadata:
  name: jellyfin
  namespace: external
spec:
  type: ExternalName
  externalName: "192.168.1.215"
  ports:
    - port: 8096
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: jellyfin
  namespace: external
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`media.perihelion.live`)
      kind: Rule
      services:
        - name: jellyfin
          port: 8096
      middlewares:
        - name: jellyfin-headers
  tls: {}
