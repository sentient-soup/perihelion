# ===========================================================================
# jellyseerr :5055 — served on two hostnames (request + jellyseerr), so one
# Service/EndpointSlice with two IngressRoutes.
# ===========================================================================
---
apiVersion: v1
kind: Service
metadata:
  name: jellyseerr
  namespace: external
spec:
  type: ExternalName
  externalName: "192.168.1.215"
  ports:
    - port: 5055
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: jellyseerr
  namespace: external
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`request.perihelion.live`) || Host(`jellyseerr.perihelion.live`)
      kind: Rule
      services:
        - name: jellyseerr
          port: 5055
      middlewares:
        - name: web-security-headers
  tls: {}
