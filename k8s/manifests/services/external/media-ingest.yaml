# ===========================================================================
# jellyseerr :5055 — served on two hostnames (request + jellyseerr), so one
# Service/EndpointSlice with two IngressRoutes.
# ===========================================================================
---
apiVersion: v1
kind: Service
metadata:
  name: jellyseerr
  namespace: external
spec:
  ports:
    - port: 5055
      targetPort: 5055
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: jellyseerr
  namespace: external
  labels:
    kubernetes.io/service-name: jellyseerr
addressType: IPv4
ports:
  - port: 5055
endpoints:
  - addresses: ["192.168.1.215"]
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: jellyseerr
  namespace: external
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`request.perihelion.live`) || Host(`jellyseerr.perihelion.live`)
      kind: Rule
      services:
        - name: jellyseerr
          port: 5055
      middlewares:
        - name: web-security-headers
  tls: {}
