# The *arr ingest stack + qBittorrent + jellyseerr, all on phis4. Each host is an
# ExternalName Service + IngressRoute. All carry the shared web-security-headers
# middleware; qBittorrent additionally needs qbit-referer.
# ===========================================================================
# torrent.perihelion.live -> qBittorrent :8085
# ===========================================================================
---
apiVersion: v1
kind: Service
metadata:
  name: qbittorrent
  namespace: external
spec:
  type: ExternalName
  externalName: "192.168.1.215"
  ports:
    - port: 8085
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: qbittorrent
  namespace: external
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`torrent.perihelion.live`)
      kind: Rule
      services:
        - name: qbittorrent
          port: 8085
      middlewares:
        - name: web-security-headers
        - name: qbit-referer
  tls: {}
