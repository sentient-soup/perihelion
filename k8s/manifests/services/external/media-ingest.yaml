# The *arr ingest stack + qBittorrent + jellyseerr, all on phis4. Each host is a
# selectorless Service + EndpointSlice + IngressRoute. All carry the shared
# web-security-headers middleware; qBittorrent additionally needs qbit-referer.
# ===========================================================================
# torrent.perihelion.live -> qBittorrent :8085
# ===========================================================================
---
apiVersion: v1
kind: Service
metadata:
  name: qbittorrent
  namespace: external
spec:
  ports:
    - port: 8085
      targetPort: 8085
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: qbittorrent
  namespace: external
  labels:
    kubernetes.io/service-name: qbittorrent
addressType: IPv4
ports:
  - port: 8085
endpoints:
  - addresses: ["192.168.1.215"]
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: qbittorrent
  namespace: external
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`torrent.perihelion.live`)
      kind: Rule
      services:
        - name: qbittorrent
          port: 8085
      middlewares:
        - name: web-security-headers
        - name: qbit-referer
  tls: {}
