# ai.perihelion.live -> odysseus on phis4:7000
---
apiVersion: v1
kind: Service
metadata:
  name: odysseus
  namespace: external
spec:
  type: ExternalName
  externalName: "192.168.1.215"
  ports:
    - port: 7000
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: odysseus
  namespace: external
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`ai.perihelion.live`)
      kind: Rule
      services:
        - name: odysseus
          port: 7000
      middlewares:
        - name: web-security-headers
  tls: {}
