# books.perihelion.live -> audiobookshelf on phis4:13378
# Large uploads + websockets work out of the box (Traefik streams and upgrades).
---
apiVersion: v1
kind: Service
metadata:
  name: audiobookshelf
  namespace: external
spec:
  type: ExternalName
  externalName: "192.168.1.215"
  ports:
    - port: 13378
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: audiobookshelf
  namespace: external
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`books.perihelion.live`)
      kind: Rule
      services:
        - name: audiobookshelf
          port: 13378
      middlewares:
        - name: web-security-headers
  tls: {}
