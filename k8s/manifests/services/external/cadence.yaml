# cadence.perihelion.live -> cadence on phis4:3000
---
apiVersion: v1
kind: Service
metadata:
  name: cadence
  namespace: external
spec:
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: v1
kind: Endpoints
metadata:
  name: cadence
  namespace: external
subsets:
  - addresses:
      - ip: 192.168.1.215
    ports:
      - port: 3000
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: cadence
  namespace: external
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`cadence.perihelion.live`)
      kind: Rule
      services:
        - name: cadence
          port: 3000
      middlewares:
        - name: web-security-headers
  tls: {}
