# Sink — media ingest tool (audiobooks/ebooks): web upload, metadata match,
# transfer into the library. File-based config, no DB. Docs: ../../README.md
#
# Auto-updated: tracks :latest and carries the watchtower opt-in label, like
# cadence (see services/watchtower/).

services:
  sink:
    image: ghcr.io/sentient-soup/sink:latest
    container_name: sink
    restart: unless-stopped
    ports:
      - ${SINK_PORT}:6720
    volumes:
      # App config + state (config.json). Small, lives with your other configs.
      - ${CONFIG_DIR}/sink:/config
      # Upload dropzone. .tus-incoming staging sits inside this mount, so
      # completed uploads move by rename (same volume), not copy.
      - ${DATA_DIR}/ingest:/ingest
      # Destination: your existing Audiobookshelf library.
      - ${DATA_DIR}/books:/books
    environment:
      - SINK_DATA_DIR=/config
      - TZ=${TZ}
    env_file:
      - .secrets.env
    labels:
      - com.centurylinklabs.watchtower.enable=true
